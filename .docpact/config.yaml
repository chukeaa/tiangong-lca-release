version: 1
layout: repo
lastReviewedAt: "2026-08-18"
lastReviewedCommit: "5125fd8b6a1679f25b29032127e41d82bf063002"

catalog:
  repos:
    - id: release
      path: .
      canonicalRepo: chukeaa/tiangong-lca-release
      entryDoc: AGENTS.md
      workflowDocs:
        - README.md
        - workflows/README.md
        - docs/architecture.md
      workspaceIntegrationRequired: true

ownership:
  domains:
    - id: repo-governance-docs-and-automation
      paths:
        include:
          - AGENTS.md
          - README.md
          - docs/**
          - .docpact/**
          - .gitignore
          - .env.example
          - package.json
          - .github/workflows/ci.yml
      ownerRepo: release
    - id: shared-workflow-contract
      paths:
        include:
          - workflows/README.md
          - workflows/AGENTS.md
      ownerRepo: release
    - id: calculation-workflow
      paths:
        include:
          - workflows/calculation/**
      ownerRepo: release
    - id: dataset-transformation-workflow
      paths:
        include:
          - workflows/dataset-transformation/**
      ownerRepo: release
    - id: result-materialization-workflow
      paths:
        include:
          - workflows/result-materialization/**
      ownerRepo: release
    - id: release-publication-workflow
      paths:
        include:
          - workflows/release/**
      ownerRepo: release

coverage:
  include:
    - AGENTS.md
    - README.md
    - docs/**
    - .docpact/**
    - .gitignore
    - .env.example
    - workflows/**
    - package.json
    - .github/workflows/ci.yml
  exclude:
    - .git/**
    - .docpact/runs/**
    - node_modules/**
    - .release/**
    - package-lock.json
    - "*.log"

freshness:
  warn_after_commits: 40
  warn_after_days: 60
  critical_after_days: 120

routing:
  intents:
    calculation-workflow:
      paths:
        - workflows/AGENTS.md
        - workflows/calculation/**
        - README.md
    dataset-transformation-workflow:
      paths:
        - workflows/AGENTS.md
        - workflows/dataset-transformation/**
        - README.md
    result-materialization-workflow:
      paths:
        - workflows/AGENTS.md
        - workflows/result-materialization/**
        - README.md
    release-workflow:
      paths:
        - workflows/AGENTS.md
        - workflows/release/**
        - README.md
    validation-and-automation:
      paths:
        - package.json
        - .github/workflows/ci.yml
        - .docpact/config.yaml
    repo-docs:
      paths:
        - AGENTS.md
        - README.md
        - docs/**
        - .docpact/**
        - .env.example
        - workflows/**
    root-integration:
      paths:
        - AGENTS.md
        - .docpact/config.yaml
        - docs/architecture.md

docInventory:
  include:
    - AGENTS.md
    - README.md
    - .docpact/config.yaml
    - docs/architecture.md
    - workflows/README.md
    - workflows/AGENTS.md
    - workflows/**/README.md
    - workflows/**/AGENTS.md

repo:
  id: release
  owner: release

rules:
  - id: release-bootstrap-contract
    scope: repo
    repo: release
    triggers:
      - path: AGENTS.md
        kind: doc-contract
      - path: .docpact/config.yaml
        kind: doc-ai-layer
      - path: docs/architecture.md
        kind: architecture
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: workflows/README.md
        mode: review_or_update
      - path: workflows/AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/architecture.md
        mode: review_or_update
    reason: Repository guidance, workflow navigation, machine-readable routing, and architecture must stay aligned.
  - id: release-landing-contract
    scope: repo
    repo: release
    triggers:
      - path: README.md
        kind: repo-landing
      - path: .env.example
        kind: operator-env-template
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
    reason: User-facing purpose, current status, and security guidance must match the repository contract.
  - id: release-workflow-shared-contract
    scope: repo
    repo: release
    triggers:
      - path: workflows/README.md
        kind: workflow-index
      - path: workflows/AGENTS.md
        kind: workflow-shared-contract
    requiredDocs:
      - path: workflows/README.md
        mode: review_or_update
      - path: workflows/AGENTS.md
        mode: review_or_update
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: docs/architecture.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
    reason: Shared workflow navigation and Agent rules must remain aligned with the repository contract and architecture.
  - id: calculation-workflow-contract
    scope: repo
    repo: release
    triggers:
      - path: workflows/calculation/**
        kind: calculation-workflow
    requiredDocs:
      - path: workflows/calculation/AGENTS.md
        mode: review_or_update
      - path: workflows/calculation/README.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
    reason: Calculation entry, validation, remote task, download, evidence, and recovery behavior must stay coherent.
  - id: dataset-transformation-workflow-contract
    scope: repo
    repo: release
    triggers:
      - path: workflows/dataset-transformation/**
        kind: dataset-transformation-workflow
    requiredDocs:
      - path: workflows/dataset-transformation/AGENTS.md
        mode: review_or_update
      - path: workflows/dataset-transformation/README.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
    reason: Transformation intent, frozen execution, field declarations, deterministic validation, and output boundaries must stay coherent.
  - id: result-materialization-workflow-contract
    scope: repo
    repo: release
    triggers:
      - path: workflows/result-materialization/**
        kind: result-materialization-workflow
    requiredDocs:
      - path: workflows/result-materialization/AGENTS.md
        mode: review_or_update
      - path: workflows/result-materialization/README.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
    reason: Result Process, LifecycleModel, identity/version planning, canonical dataset output, and validation behavior must stay coherent.
  - id: release-publication-workflow-contract
    scope: repo
    repo: release
    triggers:
      - path: workflows/release/**
        kind: release-workflow
    requiredDocs:
      - path: workflows/release/AGENTS.md
        mode: review_or_update
      - path: workflows/release/README.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
    reason: Package, candidate, approval, publication, and independent readback behavior must stay coherent.
  - id: release-validation-contract
    scope: repo
    repo: release
    triggers:
      - path: .gitignore
        kind: generated-runtime-exclusion
      - path: package.json
        kind: build-contract
      - path: .github/workflows/ci.yml
        kind: automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/architecture.md
        mode: review_or_update
    reason: The documentation baseline and repository-level validation entrypoints must stay aligned.
