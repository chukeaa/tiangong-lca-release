name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workflows/calculation/package-lock.json
            workflows/result-materialization/package-lock.json
            workflows/release-candidate/package-lock.json
            workflows/dataset-transformation/package-lock.json
            workflows/publication/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix workflows/calculation ci
          npm --prefix workflows/result-materialization ci
          npm --prefix workflows/release-candidate ci
          npm --prefix workflows/dataset-transformation ci
          npm --prefix workflows/publication ci

      - name: Validate workflow documentation baseline
        run: npm run prepush:gate
