name: Supabase consumer manifest

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-closure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout actual delivery commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve canonical main provenance
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run manifest positive and negative tests
        run: node --import tsx --test test/supabase-consumer-manifest.test.ts

      - name: Scan actual HEAD and prove exact set plus zero governed-byte drift
        run: npm run consumer-manifest:verify
